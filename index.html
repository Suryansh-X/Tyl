<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vijay Electronics | Railway Road Mukerian</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

    <style>
        :root {
            --brand: #6366f1;
            --brand-secondary: #f59e0b;
            --brand-glow: rgba(99, 102, 241, 0.4);
            --surface: #020617;
            --card: #0f172a;
            --text: #f8fafc;
            --text-dim: #94a3b8;
            --border: rgba(255, 255, 255, 0.08);
            --whatsapp: #22c55e;
            --glass: rgba(15, 23, 42, 0.85);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--surface); color: var(--text); overflow-x: hidden; scroll-behavior: smooth; }

        /* BACKGROUND ANIMATION */
        .bg-glow {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1; pointer-events: none;
            background: radial-gradient(circle at 50% 50%, #1e1b4b 0%, #020617 100%);
        }
        .orb {
            position: absolute; background: var(--brand); border-radius: 50%;
            filter: blur(80px); opacity: 0.1; animation: orbit 25s infinite linear;
        }
        @keyframes orbit {
            0% { transform: translate(0, 0) rotate(0deg); }
            50% { transform: translate(200px, 100px) rotate(180deg); }
            100% { transform: translate(0, 0) rotate(360deg); }
        }

        /* NAVBAR */
        header {
            position: fixed; top: 0; width: 100%; z-index: 1000;
            background: var(--glass); backdrop-filter: blur(30px);
            border-bottom: 1px solid var(--border); padding: 15px 5%;
            display: flex; justify-content: space-between; align-items: center;
        }
        .logo { font-weight: 800; font-size: 1.4rem; letter-spacing: -1px; text-transform: uppercase; }
        .logo span { 
            background: linear-gradient(to right, #6366f1, #a855f7, #f59e0b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: colorShift 8s infinite alternate;
        }
        @keyframes colorShift { from { filter: hue-rotate(0deg); } to { filter: hue-rotate(90deg); } }

        /* FEATURE DISPLAY BOX */
        .hero { padding: 160px 5% 40px; text-align: center; }
        .feature-box {
            max-width: 900px; margin: 0 auto; padding: 50px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border); border-radius: 40px;
            box-shadow: 0 0 60px var(--brand-glow);
            animation: floatHero 6s ease-in-out infinite;
        }
        @keyframes floatHero {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        /* SEARCH BAR */
        .search-container { max-width: 550px; margin: 40px auto; position: relative; }
        .search-container input {
            width: 100%; padding: 22px 65px; background: var(--card);
            border: 1px solid var(--border); border-radius: 25px; color: white;
            font-size: 1.1rem; outline: none; transition: 0.4s;
        }
        .search-container input:focus { border-color: var(--brand); box-shadow: 0 0 30px var(--brand-glow); }
        .search-container i { position: absolute; left: 25px; top: 50%; transform: translateY(-50%); color: var(--brand); font-size: 1.4rem; }

        /* PRODUCT GRID */
        .page-width { padding: 40px 5% 100px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 35px; }
        .card { 
            background: var(--card); border-radius: 35px; padding: 25px; 
            border: 1px solid var(--border); transition: 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            opacity: 0; transform: translateY(40px);
        }
        .card.reveal { opacity: 1; transform: translateY(0); }
        .card:hover { transform: scale(1.03) translateY(-10px); border-color: var(--brand); box-shadow: 0 25px 50px rgba(0,0,0,0.6); }
        
        .img-wrap { height: 250px; background: #000; border-radius: 25px; margin-bottom: 20px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .img-wrap img { max-width: 80%; transition: 0.8s ease; }
        .card:hover .img-wrap img { transform: scale(1.1) rotate(2deg); }

        .price { font-size: 1.8rem; font-weight: 900; color: white; margin: 15px 0; }
        
        /* WHATSAPP BUTTON */
        .wa-btn { 
            background: var(--whatsapp); color: white; padding: 18px; border-radius: 22px; 
            font-weight: 800; width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; text-decoration: none;
            transition: 0.3s;
        }
        .wa-btn:hover { background: #1aad53; transform: scale(1.02); }

        /* ADMIN PANEL */
        #adminPanel { 
            position: fixed; top: 0; right: -100%; width: 500px; height: 100%; 
            background: #020617; z-index: 2000; transition: 0.8s cubic-bezier(0.8, 0, 0.2, 1); 
            padding: 50px; border-left: 2px solid var(--brand); overflow-y: auto;
        }
        #adminPanel.active { right: 0; }
        .admin-form { background: var(--card); padding: 30px; border-radius: 25px; border: 1px solid var(--border); }
        .admin-form input, .admin-form textarea, .admin-form select { 
            width: 100%; padding: 15px; margin-bottom: 15px; background: #000; border: 1px solid var(--border); border-radius: 15px; color: white;
        }

        /* HIDDEN ELEMENTS */
        #bgMusic { display: none; }
    </style>
</head>
<body>

<div class="bg-glow">
    <div class="orb" style="width: 500px; height: 500px; top: -10%; left: -10%;"></div>
    <div class="orb" style="width: 400px; height: 400px; bottom: -5%; right: -5%; background: var(--brand-secondary);"></div>
</div>

<audio id="bgMusic" loop preload="auto">
    <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-8.mp3" type="audio/mpeg">
</audio>

<header>
    <div>
        <div class="logo">Vijay <span>Electronics</span></div>
        <div style="font-size: 0.6rem; color: var(--text-dim); font-weight: 700; letter-spacing: 1px;">RAILWAY ROAD MUKERIAN</div>
    </div>
    <div onclick="toggleAdmin()" style="cursor:pointer; width:45px; height:45px; border-radius:15px; background:var(--border); display:flex; align-items:center; justify-content:center;">
        <i class="ph ph-user-gear" style="font-size: 1.5rem; color: var(--text-dim);"></i>
    </div>
</header>

<section class="hero">
    <div class="feature-box">
        <h1 style="font-size: 3rem; font-weight: 800; margin-bottom: 15px;">Modernized Showcase.</h1>
        <p style="color: var(--text-dim); font-size: 1.1rem;">Explore premium appliances and gadgets with real-time availability.</p>
        <div class="search-container">
            <i class="ph ph-magnifying-glass"></i>
            <input type="text" id="searchInput" placeholder="Search by product or brand..." onkeyup="filterProducts()">
        </div>
    </div>
</section>

<div class="page-width">
    <div id="productGrid" class="grid"></div>
</div>

<div id="adminPanel">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:40px;">
        <h2 style="font-weight: 800;">Staff Management</h2>
        <i class="ph ph-x" onclick="toggleAdmin()" style="font-size: 2rem; cursor:pointer;"></i>
    </div>
    
    <div class="admin-form">
        <input type="hidden" id="pId">
        <input type="text" id="pName" placeholder="Product Name">
        <select id="pCategory">
            <option value="Appliances">Appliances</option>
            <option value="Gadgets">Gadgets</option>
            <option value="Smart Home">Smart Home</option>
        </select>
        <input type="number" id="pPrice" placeholder="Price (₹)">
        <textarea id="pDetails" placeholder="Product Features/Details..." rows="4"></textarea>
        <input type="file" id="pImage">
        <button onclick="handleSave()" style="width:100%; padding:20px; border-radius:18px; border:none; background:var(--brand); color:white; font-weight:800; cursor:pointer;">Live Update</button>
    </div>

    <div id="adminList" style="margin-top:40px;"></div>
</div>

<script>
    // FIREBASE CONFIG
    const firebaseConfig = {
        apiKey: "AIzaSyAjhi25Q8urRDAS33nxMl3J3PCh8u8-b64",
        authDomain: "igelectrons.firebaseapp.com",
        projectId: "igelectrons",
        databaseURL: "https://igelectrons-default-rtdb.firebaseio.com"
    };
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    // BACKGROUND MUSIC - Autoplay bypass logic
    const music = document.getElementById('bgMusic');
    const playMusic = () => {
        music.play().catch(() => {});
        document.removeEventListener('mousedown', playMusic);
        document.removeEventListener('scroll', playMusic);
    };
    document.addEventListener('mousedown', playMusic);
    document.addEventListener('scroll', playMusic);

    // INVENTORY LOGIC
    let products = [];

    database.ref('inventory').on('value', snapshot => {
        const data = snapshot.val();
        products = [];
        for (let key in data) products.push({ id: key, ...data[key] });
        renderView(products);
        renderAdminList();
    });

    function renderView(items) {
        const grid = document.getElementById('productGrid');
        grid.innerHTML = items.map((p, i) => {
            const waUrl = `https://wa.me/919876898832?text=${encodeURIComponent(`Hello I found ${p.name} with ${p.details} on your website. How can I purchase?`)}`;
            return `
                <div class="card" style="transition-delay: ${i * 50}ms">
                    <div class="img-wrap"><img src="${p.image}"></div>
                    <div style="font-size:0.7rem; color:var(--brand-secondary); font-weight:800; text-transform:uppercase;">${p.category}</div>
                    <h3 style="margin:10px 0; height:45px; overflow:hidden;">${p.name}</h3>
                    <div class="price">₹${parseInt(p.price).toLocaleString('en-IN')}</div>
                    <a href="${waUrl}" target="_blank" class="wa-btn">
                        <i class="ph-fill ph-whatsapp-logo"></i> Inquiry
                    </a>
                </div>
            `;
        }).join('');
        
        setTimeout(() => {
            document.querySelectorAll('.card').forEach(c => c.classList.add('reveal'));
        }, 100);
    }

    // ADMIN ACTIONS
    function toggleAdmin() {
        if (!document.getElementById('adminPanel').classList.contains('active')) {
            if (prompt("Enter Access PIN:") !== "ig99") return;
        }
        document.getElementById('adminPanel').classList.toggle('active');
    }

    function handleSave() {
        const id = document.getElementById('pId').value;
        const file = document.getElementById('pImage').files[0];
        
        const saveData = (imgUrl = null) => {
            const entry = {
                name: document.getElementById('pName').value,
                category: document.getElementById('pCategory').value,
                price: document.getElementById('pPrice').value,
                details: document.getElementById('pDetails').value
            };
            if(imgUrl) entry.image = imgUrl;

            if(id) {
                database.ref('inventory/' + id).update(entry);
            } else {
                database.ref('inventory').push(entry);
            }
            resetForm();
            alert("Platform updated live!");
        };

        if(file) {
            const reader = new FileReader();
            reader.onloadend = () => saveData(reader.result);
            reader.readAsDataURL(file);
        } else {
            saveData();
        }
    }

    function renderAdminList() {
        document.getElementById('adminList').innerHTML = products.map(p => `
            <div style="background:rgba(255,255,255,0.05); padding:15px; border-radius:15px; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center;">
                <span style="font-size:0.8rem;">${p.name}</span>
                <div>
                    <i class="ph ph-pencil" onclick="editProduct('${p.id}')" style="margin-right:15px; color:var(--brand); cursor:pointer;"></i>
                    <i class="ph ph-trash" onclick="deleteProduct('${p.id}')" style="color:red; cursor:pointer;"></i>
                </div>
            </div>
        `).join('');
    }

    function editProduct(id) {
        const p = products.find(x => x.id === id);
        document.getElementById('pId').value = p.id;
        document.getElementById('pName').value = p.name;
        document.getElementById('pCategory').value = p.category;
        document.getElementById('pPrice').value = p.price;
        document.getElementById('pDetails').value = p.details;
    }

    function deleteProduct(id) {
        if(confirm("Permanently delete this product?")) database.ref('inventory/' + id).remove();
    }

    function resetForm() {
        ['pId', 'pName', 'pPrice', 'pDetails', 'pImage'].forEach(id => document.getElementById(id).value = '');
    }

    function filterProducts() {
        const val = document.getElementById('searchInput').value.toLowerCase();
        renderView(products.filter(p => p.name.toLowerCase().includes(val) || p.category.toLowerCase().includes(val)));
    }
</script>

</body>
    </html>
